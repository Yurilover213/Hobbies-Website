<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    ol li{
        margin: 20px;
        font-size: 20px
    }
</style>

</head>


<body>

<ol>
    <li id="BookTitle"></li>
    <li id="Genres"></li>
    <li id="Rating"></li>
    <li id="TotalChapters"></li>
    <li id="ChaptersRead"></li>
    <li id="Synopsis"></li>
    <li id="Review"></li>

</ol>

</body>

<script>
    const formData = new URLSearchParams(window.location.search);

    const bookTitle = formData.get("bookTitle");
    const genres = formData.getAll("genres");
    const rating = formData.get("rating");
    const totalChapters = formData.get("totalChapters");
    const chaptersRead = formData.get("chaptersRead");
    const synopsis = formData.get("synopsis");
    const review = formData.get("review");

    document.querySelector("#BookTitle").textContent = "Book Title: " + bookTitle 
    document.querySelector("#Genres").textContent = "Genres: " + (genres.join(", "));
    document.querySelector("#Rating").textContent = "Rating: " + ( rating + "/5" );
    document.querySelector("#TotalChapters").textContent = "Total Chapters: " + (totalChapters);
    document.querySelector("#ChaptersRead").textContent = "Chapters Read: " + (chaptersRead);
    document.querySelector("#Synopsis").textContent = "Synopsis: " + synopsis ;
    document.querySelector("#Review").textContent = "Review: " + review;
</script>
